site_name: k3fnmatch
site_description: Enhanced fnmatch with grouping regex and path transformation utilities
site_url: https://k3fnmatch.readthedocs.io
repo_url: https://github.com/pykit3/k3fnmatch
repo_name: pykit3/k3fnmatch

theme:
  name: material
  palette:
    primary: blue
    accent: blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
